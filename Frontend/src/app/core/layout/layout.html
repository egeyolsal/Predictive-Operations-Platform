<div class="layout-container" [class.sidebar-open]="sidebarOpen()">
  
  @if (sidebarOpen()) {
    <div class="layout-mask" (click)="toggleSidebar()"></div>
  }

  <app-sidebar class="layout-sidebar" [isOpen]="sidebarOpen()"></app-sidebar>
  
  <div class="main-wrapper">
    <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
  
  <app-ai-chat-widget></app-ai-chat-widget>
</div>

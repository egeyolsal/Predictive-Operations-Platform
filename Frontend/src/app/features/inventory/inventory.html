<h2>Inventory</h2>

<p-toast />

<p-table
  [value]="filteredItems()"
  [loading]="isLoading()"
  [paginator]="true"
  [rows]="10"
>
  <ng-template pTemplate="caption">
    <div class="table-header">
      <p-button label="Add New" icon="pi pi-plus" (onClick)="openAddDialog()" />
      <input
        pInputText
        type="text"
        placeholder="Search..."
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
      <th pSortableColumn="category">Category <p-sortIcon field="category" /></th>
      <th pSortableColumn="currentStock">Current Stock <p-sortIcon field="currentStock" /></th>
      <th pSortableColumn="criticalThreshold">Critical Threshold <p-sortIcon field="criticalThreshold" /></th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.category }}</td>
      <td>{{ item.currentStock }}</td>
      <td>{{ item.criticalThreshold }}</td>
      <td>
        @if (item.isBelowCriticalThreshold) {
          <p-tag severity="danger" value="Critical" />
        } @else {
          <p-tag severity="success" value="OK" />
        }
      </td>
      <td>
        <p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="openEditDialog(item)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="onDelete(item)" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="6">No inventory items found.</td>
    </tr>
  </ng-template>
</p-table>

<app-inventory-form
  [visible]="dialogVisible()"
  [editingItem]="editingItem()"
  (visibleChange)="onDialogVisibleChange($event)"
  (saved)="onSaved()"
/>

<div class="page-container">
  <div class="page-header">
    <div class="title-section">
      <h1 class="page-title">Categories</h1>
      <p class="page-subtitle">Manage item and task categories</p>
    </div>
    <div class="action-section">
      <span class="p-input-icon-left search-input">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Search categories..." (input)="onSearchInput($event)" />
      </span>
      @if (isAdmin()) {
        <p-button 
          label="Add Category" 
          icon="pi pi-plus" 
          (onClick)="openAddDialog()"
          styleClass="p-button-primary">
        </p-button>
      }
    </div>
  </div>

  <div class="table-card">
    <p-table 
      [value]="filteredItems()" 
      [loading]="isLoading()"
      [paginator]="true" 
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-sm custom-table"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
          <th pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
          @if (isAdmin()) {
            <th class="text-right" style="width: 120px;">Actions</th>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td class="font-semibold">{{ item.name }}</td>
          <td class="text-color-secondary">{{ item.description || '-' }}</td>
          @if (isAdmin()) {
            <td class="text-right">
              <div class="action-buttons">
                <p-button 
                  icon="pi pi-pencil" 
                  severity="info" 
                  [text]="true" 
                  [rounded]="true" 
                  (onClick)="openEditDialog(item)">
                </p-button>
                <p-button 
                  icon="pi pi-trash" 
                  severity="danger" 
                  [text]="true" 
                  [rounded]="true" 
                  (onClick)="onDelete(item)">
                </p-button>
              </div>
            </td>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isAdmin() ? 3 : 2" class="text-center p-4">No categories found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast></p-toast>
<app-category-form
  [visible]="dialogVisible()"
  [editingItem]="editingItem()"
  (visibleChange)="onDialogVisibleChange($event)"
  (saved)="onSaved()"
></app-category-form>

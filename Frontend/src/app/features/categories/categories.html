<div class="page-container">
  <div class="flex justify-content-between align-items-center mb-5">
    <div>
      <h1 class="m-0 text-3xl font-semibold text-color">Categories</h1>
      <p class="text-color-secondary mt-1">Manage item and task categories</p>
    </div>
    <div class="flex align-items-center gap-3">
      <input pInputText type="text" placeholder="Search categories..." (input)="onSearchInput($event)" class="w-15rem" />
      @if (isAdmin()) {
        <p-button 
          label="Add Category" 
          icon="pi pi-plus" 
          (onClick)="openAddDialog()">
        </p-button>
      }
    </div>
  </div>

  <p-table 
    [value]="filteredItems()" 
    [loading]="isLoading()"
    [paginator]="true" 
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    responsiveLayout="scroll"
  >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
          <th pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
          @if (isAdmin()) {
            <th class="text-right" style="width: 120px;">Actions</th>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td class="font-semibold">{{ item.name }}</td>
          <td class="text-color-secondary">{{ item.description || '-' }}</td>
          @if (isAdmin()) {
            <td class="text-right">
              <div class="action-buttons">
                <p-button 
                  icon="pi pi-pencil" 
                  severity="info" 
                  [text]="true" 
                  [rounded]="true" 
                  (onClick)="openEditDialog(item)">
                </p-button>
                <p-button 
                  icon="pi pi-trash" 
                  severity="danger" 
                  [text]="true" 
                  [rounded]="true" 
                  (onClick)="onDelete(item)">
                </p-button>
              </div>
            </td>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isAdmin() ? 3 : 2" class="text-center p-4">No categories found.</td>
        </tr>
      </ng-template>
    </p-table>
</div>

<p-toast></p-toast>
<app-category-form
  [visible]="dialogVisible()"
  [editingItem]="editingItem()"
  (visibleChange)="onDialogVisibleChange($event)"
  (saved)="onSaved()"
></app-category-form>

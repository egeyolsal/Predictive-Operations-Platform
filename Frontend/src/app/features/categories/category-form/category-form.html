<p-dialog
  [visible]="visible()"
  (visibleChange)="onHide()"
  [modal]="true"
  [style]="{ width: '90vw', maxWidth: '450px' }"
  [header]="editingItem() ? 'Edit Category' : 'Add Category'"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" pInputText formControlName="name" class="full-width" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <small class="error-text">Name is required (max 100 characters).</small>
      }
    </div>
    
    <div class="field">
      <label for="description">Description (Optional)</label>
      <textarea id="description" pInputTextarea formControlName="description" rows="3" class="full-width"></textarea>
      @if (form.controls.description.invalid && form.controls.description.touched) {
        <small class="error-text">Description cannot exceed 500 characters.</small>
      }
    </div>

    <div class="form-actions mt-4">
      <p-button label="Cancel" severity="secondary" type="button" (onClick)="onHide()" />
      <p-button label="Save" type="submit" [loading]="isSubmitting()" />
    </div>
  </form>
</p-dialog>

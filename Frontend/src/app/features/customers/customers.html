<div class="card">
    <div class="flex justify-content-between align-items-center mb-4">
        <h2>Müşteriler (Customers)</h2>
        <p-button label="Yeni Müşteri Ekle" icon="pi pi-plus" (onClick)="showDialogToAdd()"></p-button>
    </div>

    <p-table [value]="customers" [paginator]="true" [rows]="10" [tableStyle]="{ 'min-width': '50rem' }"
             [globalFilterFields]="['name', 'email', 'phone', 'address']" #dt>
        <ng-template pTemplate="caption">
            <div class="flex">
                <span class="p-input-icon-left ml-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Ara..." />
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Firma Adı <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="email">E-posta <p-sortIcon field="email"></p-sortIcon></th>
                <th pSortableColumn="phone">Telefon <p-sortIcon field="phone"></p-sortIcon></th>
                <th pSortableColumn="address">Adres <p-sortIcon field="address"></p-sortIcon></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-customer>
            <tr>
                <td>{{ customer.name }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phone }}</td>
                <td>{{ customer.address }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4">Müşteri bulunamadı.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Müşteri Ekle" [(visible)]="displayDialog" [modal]="true" [style]="{ width: '450px' }" [draggable]="false" [resizable]="false">
    <form [formGroup]="customerForm" (ngSubmit)="saveCustomer()" class="p-fluid">
        <div class="field mb-3">
            <label for="name">Müşteri/Firma Adı *</label>
            <input type="text" pInputText id="name" formControlName="name" autofocus />
            <small class="p-error" *ngIf="customerForm.get('name')?.invalid && customerForm.get('name')?.touched">Müşteri adı zorunludur.</small>
        </div>
        <div class="field mb-3">
            <label for="email">E-posta</label>
            <input type="email" pInputText id="email" formControlName="email" />
            <small class="p-error" *ngIf="customerForm.get('email')?.errors?.['email'] && customerForm.get('email')?.touched">Geçerli bir e-posta giriniz.</small>
        </div>
        <div class="field mb-3">
            <label for="phone">Telefon</label>
            <input type="text" pInputText id="phone" formControlName="phone" />
        </div>
        <div class="field mb-4">
            <label for="address">Adres</label>
            <input type="text" pInputText id="address" formControlName="address" />
        </div>

        <div class="flex justify-content-end gap-2">
            <p-button label="İptal" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="displayDialog = false"></p-button>
            <p-button label="Kaydet" icon="pi pi-check" type="submit" [disabled]="customerForm.invalid"></p-button>
        </div>
    </form>
</p-dialog>

<div class="login-page">

  <!-- ===================== RIGHT BACKGROUND (illustration fills this area) ===================== -->
  <div class="right-bg">
    <img class="bg-illustration"
         src="assets/login-illustration.svg"
         alt="" aria-hidden="true" />
  </div>

  <!-- ===================== LEFT COLUMN (form card) ===================== -->
  <div class="left-col">
    <div class="form-card">

      <!-- Logo -->
      <div class="logo-mark"></div>

      <!-- Headings -->
      <h1 class="heading">Login</h1>
      <p class="sub-heading">See your growth and get support!</p>

      <!-- Google Button -->
      <button type="button" class="btn-google">
        Sign in with google <span class="g-logo">G</span>
      </button>

      <!-- Form -->
      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- Email -->
        <div class="field">
          <label class="field-label" for="username">Email*</label>
          <input
            id="username"
            class="text-input"
            type="text"
            formControlName="username"
            placeholder="Enter your email"
            autocomplete="username"
            autofocus
          />
        </div>

        <!-- Password -->
        <div class="field">
          <label class="field-label" for="password">Password*</label>
          <div class="password-wrapper">
            <input
              id="password"
              class="text-input"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="minimum 8 characters"
              autocomplete="current-password"
            />
            <button type="button" class="eye-btn"
                    (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Remember / Forgot -->
        <div class="form-extras">
          <label class="remember">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember me</span>
          </label>
          <a routerLink="/forgot-password" class="forgot">Forgot password?</a>
        </div>

        <!-- Error -->
        @if (errorMessage()) {
          <div class="error-msg">{{ errorMessage() }}</div>
        }

        <!-- Login Button -->
        <button type="submit" class="btn-login" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner"></span>
          } @else {
            Login
          }
        </button>

        <!-- Register -->
        <p class="register-text">
          Not registered yet? <a routerLink="/register">Create a new account</a>
        </p>

      </form>
    </div>
  </div>

</div>

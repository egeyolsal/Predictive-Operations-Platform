<div class="login-container">
  <p-card header="Login" class="login-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" pInputText formControlName="username" class="full-width" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="full-width" />
      </div>

      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" />
      }

      <p-button type="submit" label="Login" [loading]="isSubmitting()" styleClass="full-width" />
    </form>
  </p-card>
</div>

<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="platTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="platSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fa8da"/>
      <stop offset="100%" stop-color="#7986cb"/>
    </linearGradient>
    <linearGradient id="platFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c5cae9"/>
      <stop offset="100%" stop-color="#9fa8da"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d5afe"/>
      <stop offset="100%" stop-color="#304ffe"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="60%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffab40"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcc80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6d00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7986cb" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="520" fill="#f8f9ff"/>

  <!-- Background grid dots -->
  <g opacity="0.15">
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7986cb"/>
    </pattern>
    <rect width="700" height="520" fill="url(#dots)"/>
  </g>

  <!-- ============================================================
       PLATFORM 1 — BOTTOM LEFT (large base platform)
       ============================================================ -->
  <g filter="url(#shadow)" transform="translate(30, 290)">
    <!-- Top face -->
    <polygon points="130,0 260,65 130,130 0,65" fill="url(#platTop)"/>
    <!-- Left face -->
    <polygon points="0,65 130,130 130,170 0,105" fill="url(#platFront)"/>
    <!-- Right face -->
    <polygon points="260,65 130,130 130,170 260,105" fill="url(#platSide)"/>
  </g>

  <!-- Screen on platform 1 -->
  <g transform="translate(100, 230)">
    <!-- Screen body -->
    <rect x="0" y="0" width="110" height="75" rx="5" fill="url(#screenGrad)"/>
    <!-- Screen bar chart -->
    <rect x="10" y="55" width="10" height="15" fill="#fff" opacity="0.7"/>
    <rect x="25" y="42" width="10" height="28" fill="#fff" opacity="0.85"/>
    <rect x="40" y="30" width="10" height="40" fill="#fff"/>
    <rect x="55" y="38" width="10" height="32" fill="#fff" opacity="0.85"/>
    <rect x="70" y="22" width="10" height="48" fill="#fff"/>
    <rect x="85" y="35" width="10" height="35" fill="#fff" opacity="0.7"/>
    <!-- Screen title line -->
    <rect x="10" y="8" width="40" height="4" rx="2" fill="#fff" opacity="0.5"/>
    <rect x="55" y="8" width="20" height="4" rx="2" fill="#fff" opacity="0.3"/>
    <!-- Pie chart indicator -->
    <circle cx="95" cy="20" r="10" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <path d="M95,20 L95,10 A10,10 0 0,1 105,20 Z" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Person 1 — left side standing -->
  <g transform="translate(65, 290)">
    <circle cx="10" cy="0" r="8" fill="#5c6bc0"/>
    <rect x="3" y="10" width="14" height="22" rx="3" fill="#3949ab"/>
    <line x1="3" y1="16" x2="-5" y2="28" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/>
    <line x1="17" y1="16" x2="25" y2="28" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="4" y2="48" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="32" x2="16" y2="48" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ============================================================
       PLATFORM 2 — TOP LEFT
       ============================================================ -->
  <g filter="url(#shadow)" transform="translate(30, 130)">
    <polygon points="110,0 220,55 110,110 0,55" fill="url(#platTop)"/>
    <polygon points="0,55 110,110 110,145 0,90" fill="url(#platFront)"/>
    <polygon points="220,55 110,110 110,145 220,90" fill="url(#platSide)"/>
  </g>

  <!-- Big analytics screen on platform 2 -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="130" height="90" rx="6" fill="#283593"/>
    <!-- Chart lines -->
    <polyline points="10,70 30,45 55,55 80,25 110,40 125,30" fill="none" stroke="#82b1ff" stroke-width="2.5"/>
    <polyline points="10,80 30,65 55,72 80,50 110,60 125,55" fill="none" stroke="#e040fb" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Axes -->
    <line x1="10" y1="10" x2="10" y2="80" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <line x1="10" y1="80" x2="125" y2="80" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <!-- Network dots overlay -->
    <circle cx="30" cy="45" r="3" fill="#82b1ff"/>
    <circle cx="55" cy="55" r="3" fill="#82b1ff"/>
    <circle cx="80" cy="25" r="3" fill="#82b1ff"/>
    <circle cx="110" cy="40" r="3" fill="#82b1ff"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="130" height="14" rx="6" fill="#1a237e"/>
    <circle cx="8" cy="7" r="3" fill="#ef5350"/>
    <circle cx="18" cy="7" r="3" fill="#ffca28"/>
    <circle cx="28" cy="7" r="3" fill="#66bb6a"/>
  </g>

  <!-- Person 2 — on platform 2 -->
  <g transform="translate(170, 150)">
    <circle cx="10" cy="0" r="7" fill="#7e57c2"/>
    <rect x="3" y="9" width="14" height="20" rx="3" fill="#5e35b1"/>
    <line x1="3" y1="15" x2="-4" y2="25" stroke="#5e35b1" stroke-width="4" stroke-linecap="round"/>
    <line x1="17" y1="15" x2="24" y2="25" stroke="#5e35b1" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="29" x2="4" y2="43" stroke="#5e35b1" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="29" x2="16" y2="43" stroke="#5e35b1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ============================================================
       CENTRAL PLATFORM + GLOWING CORE
       ============================================================ -->
  <g filter="url(#shadow)" transform="translate(250, 200)">
    <polygon points="130,0 260,65 130,130 0,65" fill="url(#platTop)"/>
    <polygon points="0,65 130,130 130,175 0,110" fill="url(#platFront)"/>
    <polygon points="260,65 130,130 130,175 260,110" fill="url(#platSide)"/>
  </g>

  <!-- Glowing core crystal -->
  <g transform="translate(340, 90)" filter="url(#glow)">
    <!-- Glow halo -->
    <ellipse cx="40" cy="120" rx="55" ry="30" fill="url(#glowOrange)" opacity="0.4"/>
    <!-- Crystal body -->
    <polygon points="40,0 75,60 40,120 5,60" fill="url(#coreGrad)" opacity="0.95"/>
    <!-- Crystal facets -->
    <polygon points="40,0 75,60 40,60" fill="#ff8f00" opacity="0.5"/>
    <polygon points="40,0 5,60 40,60" fill="#ffe0b2" opacity="0.4"/>
    <!-- Network lines radiating out -->
    <line x1="40" y1="60" x2="-40" y2="30" stroke="#ffab40" stroke-width="1.5" opacity="0.7"/>
    <line x1="40" y1="60" x2="120" y2="30" stroke="#ffab40" stroke-width="1.5" opacity="0.7"/>
    <line x1="40" y1="60" x2="-20" y2="110" stroke="#ffab40" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="60" x2="100" y2="110" stroke="#ffab40" stroke-width="1.5" opacity="0.6"/>
    <!-- Network nodes -->
    <circle cx="-40" cy="30" r="4" fill="#ff6d00"/>
    <circle cx="120" cy="30" r="4" fill="#ff6d00"/>
    <circle cx="-20" cy="110" r="3" fill="#ffab40"/>
    <circle cx="100" cy="110" r="3" fill="#ffab40"/>
    <circle cx="40" cy="60" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- ============================================================
       PLATFORM 3 — BOTTOM RIGHT
       ============================================================ -->
  <g filter="url(#shadow)" transform="translate(430, 310)">
    <polygon points="120,0 240,60 120,120 0,60" fill="url(#platTop)"/>
    <polygon points="0,60 120,120 120,155 0,95" fill="url(#platFront)"/>
    <polygon points="240,60 120,120 120,155 240,95" fill="url(#platSide)"/>
  </g>

  <!-- Screen on platform 3 -->
  <g transform="translate(510, 245)">
    <rect x="0" y="0" width="100" height="70" rx="5" fill="#1565c0"/>
    <!-- Bar chart -->
    <rect x="8" y="50" width="10" height="16" rx="2" fill="#ef5350"/>
    <rect x="22" y="35" width="10" height="31" rx="2" fill="#42a5f5"/>
    <rect x="36" y="22" width="10" height="44" rx="2" fill="#ef5350"/>
    <rect x="50" y="38" width="10" height="28" rx="2" fill="#42a5f5"/>
    <rect x="64" y="28" width="10" height="38" rx="2" fill="#ef5350"/>
    <rect x="78" y="42" width="10" height="24" rx="2" fill="#42a5f5"/>
    <!-- Title line -->
    <rect x="8" y="8" width="35" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
    <rect x="8" y="14" width="20" height="3" rx="1.5" fill="#fff" opacity="0.25"/>
  </g>

  <!-- Person 3 — right side (working on laptop) -->
  <g transform="translate(465, 355)">
    <!-- Person seated -->
    <circle cx="14" cy="0" r="8" fill="#f06292"/>
    <rect x="5" y="10" width="18" height="18" rx="3" fill="#e91e63"/>
    <rect x="0" y="28" width="10" height="3" rx="1.5" fill="#ad1457"/><!-- left leg -->
    <rect x="18" y="28" width="10" height="3" rx="1.5" fill="#ad1457"/><!-- right leg -->
    <!-- Laptop -->
    <rect x="-8" y="16" width="22" height="14" rx="2" fill="#90a4ae"/>
    <rect x="-7" y="17" width="20" height="11" rx="1" fill="#263238"/>
    <!-- Screen content on laptop -->
    <line x1="-4" y1="21" x2="10" y2="21" stroke="#4fc3f7" stroke-width="1.5"/>
    <line x1="-4" y1="24" x2="7" y2="24" stroke="#4fc3f7" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Person 4 — right side standing looking at screen -->
  <g transform="translate(590, 290)">
    <circle cx="10" cy="0" r="7" fill="#4db6ac"/>
    <rect x="3" y="9" width="14" height="20" rx="3" fill="#00897b"/>
    <line x1="17" y1="15" x2="26" y2="20" stroke="#00897b" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="15" x2="-4" y2="20" stroke="#00897b" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="29" x2="4" y2="43" stroke="#00897b" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="29" x2="16" y2="43" stroke="#00897b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ============================================================
       TOP RIGHT PLATFORM (small, floating)
       ============================================================ -->
  <g filter="url(#shadow)" transform="translate(540, 100)">
    <polygon points="80,0 160,40 80,80 0,40" fill="url(#platTop)" opacity="0.85"/>
    <polygon points="0,40 80,80 80,105 0,65" fill="url(#platFront)" opacity="0.8"/>
    <polygon points="160,40 80,80 80,105 160,65" fill="url(#platSide)" opacity="0.8"/>
  </g>

  <!-- Floating card on top-right platform -->
  <g transform="translate(563, 65)">
    <rect x="0" y="0" width="75" height="50" rx="6" fill="#e8eaf6" stroke="#c5cae9" stroke-width="1"/>
    <!-- Tiny bar chart -->
    <rect x="8" y="35" width="8" height="10" rx="1" fill="#7986cb"/>
    <rect x="19" y="26" width="8" height="19" rx="1" fill="#5c6bc0"/>
    <rect x="30" y="18" width="8" height="27" rx="1" fill="#7986cb"/>
    <rect x="41" y="24" width="8" height="21" rx="1" fill="#5c6bc0"/>
    <rect x="52" y="30" width="8" height="15" rx="1" fill="#7986cb"/>
    <!-- Mini line -->
    <rect x="8" y="8" width="28" height="3" rx="1.5" fill="#9fa8da"/>
  </g>

  <!-- ============================================================
       CONNECTING CABLE (orange line from core to bottom)
       ============================================================ -->
  <path d="M380,370 Q395,430 460,440 Q520,450 550,420" fill="none" stroke="#ff8f00" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="460" cy="440" r="4" fill="#ff8f00" opacity="0.8"/>

  <!-- ============================================================
       SMALL FLOATING CUBES / ACCENT ELEMENTS
       ============================================================ -->
  <!-- Cube 1 — top area -->
  <g transform="translate(240, 105)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#ef9a9a"/>
    <polygon points="0,6 12,12 12,20 0,14" fill="#e53935"/>
    <polygon points="24,6 12,12 12,20 24,14" fill="#ef5350"/>
  </g>

  <!-- Cube 2 -->
  <g transform="translate(460, 250)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#ef9a9a"/>
    <polygon points="0,6 12,12 12,20 0,14" fill="#e53935"/>
    <polygon points="24,6 12,12 12,20 24,14" fill="#ef5350"/>
  </g>

  <!-- Cube 3 -->
  <g transform="translate(190, 340)">
    <polygon points="10,0 20,5 10,10 0,5" fill="#ce93d8"/>
    <polygon points="0,5 10,10 10,16 0,11" fill="#8e24aa"/>
    <polygon points="20,5 10,10 10,16 20,11" fill="#ab47bc"/>
  </g>

  <!-- Cube 4 -->
  <g transform="translate(550, 180)">
    <polygon points="10,0 20,5 10,10 0,5" fill="#ef9a9a"/>
    <polygon points="0,5 10,10 10,16 0,11" fill="#e53935"/>
    <polygon points="20,5 10,10 10,16 20,11" fill="#ef5350"/>
  </g>

  <!-- Staircase steps on central platform left -->
  <g transform="translate(258, 325)" opacity="0.75">
    <rect x="0" y="20" width="30" height="8" rx="1" fill="#9fa8da"/>
    <rect x="5" y="13" width="25" height="8" rx="1" fill="#b0bcd8"/>
    <rect x="10" y="6" width="20" height="8" rx="1" fill="#c5cae9"/>
    <rect x="15" y="0" width="15" height="7" rx="1" fill="#d9dff0"/>
  </g>

  <!-- Staircase steps on central platform right -->
  <g transform="translate(490, 325)" opacity="0.75">
    <rect x="0" y="20" width="30" height="8" rx="1" fill="#9fa8da"/>
    <rect x="0" y="13" width="25" height="8" rx="1" fill="#b0bcd8"/>
    <rect x="0" y="6" width="20" height="8" rx="1" fill="#c5cae9"/>
    <rect x="0" y="0" width="15" height="7" rx="1" fill="#d9dff0"/>
  </g>

  <!-- ============================================================
       PERSON on central platform — pointing at core
       ============================================================ -->
  <g transform="translate(290, 270)">
    <circle cx="10" cy="0" r="8" fill="#ffb74d"/>
    <rect x="3" y="10" width="14" height="22" rx="3" fill="#ff8f00"/>
    <line x1="17" y1="16" x2="30" y2="8" stroke="#ff8f00" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="16" x2="-5" y2="25" stroke="#ff8f00" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="4" y2="48" stroke="#ff8f00" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="32" x2="16" y2="48" stroke="#ff8f00" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ============================================================
       BOTTOM-RIGHT FLOATING TABLET DEVICE
       ============================================================ -->
  <g transform="translate(560, 390)">
    <rect x="0" y="0" width="55" height="38" rx="4" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
    <rect x="4" y="4" width="47" height="28" rx="2" fill="#37474f"/>
    <!-- Chart content -->
    <polyline points="6,25 15,16 22,20 30,10 40,15 50,8" fill="none" stroke="#e040fb" stroke-width="1.5"/>
    <circle cx="30" cy="10" r="2" fill="#e040fb"/>
    <!-- Home button -->
    <circle cx="27" cy="35" r="1.5" fill="#90a4ae"/>
  </g>

  <!-- ============================================================
       PERSON 5 — small, bottom walking
       ============================================================ -->
  <g transform="translate(398, 420)">
    <circle cx="8" cy="0" r="6" fill="#a5d6a7"/>
    <rect x="2" y="8" width="12" height="16" rx="2" fill="#43a047"/>
    <line x1="2" y1="12" x2="-4" y2="20" stroke="#43a047" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="12" x2="20" y2="20" stroke="#43a047" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="24" x2="2" y2="36" stroke="#43a047" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="24" x2="14" y2="36" stroke="#43a047" stroke-width="3" stroke-linecap="round"/>
  </g>

</svg>
